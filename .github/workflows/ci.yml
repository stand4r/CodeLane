name: CodeLane CI
on:
  push:
  pull_request:
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: python -m pip install --config-settings=--global-option=--without-libyaml PyYAML==6.0.3
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q main.py app core design services utils widgets extensions
      - run: pytest
